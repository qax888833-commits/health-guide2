<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강길잡이 - 병원 가기 전 준비 도우미</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#14302e;--sub:#5b716f;--main:#0f6b63;--line:#d5e2df;--warn:#fff4d6;--warn-ink:#6b4a00}
@media (prefers-color-scheme:dark){:root{--bg:#0e1716;--card:#16231f;--ink:#e6f1ef;--sub:#9db5b1;--main:#5fc4b8;--line:#2a3d39;--warn:#3a2f10;--warn-ink:#f1d98b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;line-height:1.6;padding:20px 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
textarea{width:100%;min-height:110px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
#go{width:100%;padding:15px;border:0;border-radius:12px;background:var(--main);color:#fff;font:inherit;font-weight:700;font-size:17px}
#go:disabled{opacity:.6}
.note{background:var(--warn);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:16px 0}
section.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
section.r h2{font-size:16px;margin:0 0 6px;color:var(--main)}
section.r ul{margin:0;padding-left:20px}
section.r li{margin:4px 0}
.cost{font-weight:700}
#status{margin:14px 0;color:var(--sub)}
.err{color:#b3261e}
</style>
</head>
<body>
<main>
  <h1>건강길잡이</h1>
  <p class="lead">증상을 적으면, 병원에서 무엇을 말하고 물어볼지 정리해 드려요.</p>

  <label for="sym" class="lead" style="display:block;margin-bottom:6px">어디가 어떻게 불편하신가요?</label>
  <textarea id="sym" placeholder="예: 3일 전부터 배 오른쪽 아래가 아프고 열이 조금 나요"></textarea>
  <div class="chips" id="chips">
    <button type="button">두통이 며칠째 계속돼요</button>
    <button type="button">기침과 가래가 2주째예요</button>
    <button type="button">속이 쓰리고 소화가 안 돼요</button>
  </div>
  <button id="go" type="button">병원 갈 준비 시작</button>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>

  <p class="note">이 결과는 진단이 아니라 참고용입니다. 비용은 병원·보험 적용에 따라 달라요. 숨쉬기 힘들거나 가슴 통증, 의식이 흐려지는 등 응급이면 바로 119에 연락하세요.</p>
</main>

<script>
const WORKER_URL = "https://orange-thunder-500d.qax888833.workers.dev";

const sym = document.getElementById("sym");
const go = document.getElementById("go");
const out = document.getElementById("out");
const statusEl = document.getElementById("status");

document.getElementById("chips").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") { sym.value = e.target.textContent; sym.focus(); }
});

const SECTIONS = [
  ["conditions", "가능성 있는 질환 (참고용)"],
  ["tests", "받을 수 있는 검사와 이유"],
  ["prep", "검사 전 준비사항"],
  ["tell", "의사에게 꼭 말할 것"],
  ["ask", "의사에게 물어볼 질문"],
  ["costQuestions", "비용이 걱정될 때 병원에 문의할 질문"]
];

function esc(s){ const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }

function render(d){
  let html = "";
  if (d.department) html += `<section class="r"><h2>방문하면 좋은 진료과</h2><p style="margin:0">${esc(d.department)}</p></section>`;
  if (d.costRange) html += `<section class="r"><h2>예상 진료·검사비</h2><p class="cost" style="margin:0 0 4px">${esc(d.costRange)}</p><p style="margin:0;color:var(--sub);font-size:14px">${esc(d.costNote || "병원마다 다르니 접수할 때 꼭 확인하세요.")}</p></section>`;
  for (const [key, title] of SECTIONS) {
    const arr = Array.isArray(d[key]) ? d[key] : [];
    if (!arr.length) continue;
    html += `<section class="r"><h2>${title}</h2><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>`;
  }
  out.innerHTML = html;
}

go.addEventListener("click", async () => {
  const text = sym.value.trim();
  if (text.length < 4) { statusEl.innerHTML = '<span class="err">증상을 조금 더 자세히 적어주세요.</span>'; return; }
  go.disabled = true; out.innerHTML = ""; statusEl.textContent = "정리하는 중이에요… (최대 20초)";
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symptom: text })
    });
    if (!res.ok) throw new Error("서버 응답 오류 " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    statusEl.textContent = "";
    out.scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    statusEl.innerHTML = '<span class="err">연결에 실패했어요: ' + esc(e.message) + '<br>잠시 뒤 다시 눌러보세요.</span>';
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
