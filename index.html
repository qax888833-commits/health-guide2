<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강길잡이 - 병원 가기 전 준비 도우미</title>
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12302d;--sub:#566d6a;--main:#0f6b63;--soft:#e3f1ef;--line:#d3e1de;--warn:#fff4d6;--warn-ink:#6b4a00}
@media (prefers-color-scheme:dark){:root{--bg:#0e1716;--card:#16231f;--ink:#e8f2f0;--sub:#a3b9b5;--main:#5fc4b8;--soft:#1c3330;--line:#2a3d39;--warn:#3a2f10;--warn-ink:#f1d98b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;font-size:17px;line-height:1.75;padding:20px 16px 56px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px}
.lead{color:var(--sub);margin:0 0 20px;font-size:16px}
.lbl{display:block;font-weight:700;margin:20px 0 8px}
.hint{font-weight:400;color:var(--sub);font-size:14px}
textarea,input[type=date]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px}
.chips button:active{background:var(--soft)}
#go{width:100%;margin-top:24px;padding:16px;border:0;border-radius:12px;background:var(--main);color:#fff;font:inherit;font-weight:700;font-size:18px}
#go:disabled{opacity:.6}
#status{margin:16px 0;color:var(--sub)}
.err{color:#b3261e}
.sum{background:var(--soft);border-radius:14px;padding:16px 18px;margin:20px 0 8px}
.sum .k{font-size:14px;color:var(--sub);margin:0}
.sum .v{font-size:22px;font-weight:700;margin:0 0 12px}
.sum .v:last-child{margin-bottom:0}
.sum .n{font-size:14px;color:var(--sub);margin:-8px 0 0}
section.r{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
section.r h2{font-size:19px;margin:0 0 10px;color:var(--main)}
section.r ul{margin:0;padding-left:22px}
section.r li{margin:10px 0}
.chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:5px;flex:none;accent-color:var(--main)}
.chk input:checked+span{color:var(--sub);text-decoration:line-through}
.note{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:15px;margin:24px 0 0}
textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--main);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>건강길잡이</h1>
  <p class="lead">증상을 적으면, 병원에서 무엇을 말하고 물어볼지 정리해 드려요.</p>

  <label for="sym" class="lbl">어디가 어떻게 불편하신가요?</label>
  <textarea id="sym" placeholder="예: 배 오른쪽 아래가 아프고 열이 조금 나요"></textarea>
  <div class="chips" id="chips">
    <button type="button">두통이 계속돼요</button>
    <button type="button">기침과 가래가 있어요</button>
    <button type="button">속이 쓰리고 소화가 안 돼요</button>
  </div>

  <label for="onset" class="lbl">언제부터 시작됐나요? <span class="hint">(모르면 비워 두세요)</span></label>
  <input type="date" id="onset">
  <div class="chips" id="days">
    <button type="button" data-d="0">오늘</button>
    <button type="button" data-d="1">어제</button>
    <button type="button" data-d="3">3일 전</button>
    <button type="button" data-d="7">일주일 전</button>
    <button type="button" data-d="14">2주 전</button>
  </div>

  <button id="go" type="button">병원 갈 준비 시작</button>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>

  <p class="note">이 결과는 진단이 아니라 참고용입니다. 비용은 병원·보험 적용에 따라 달라요. 숨쉬기 힘들거나 가슴 통증, 의식이 흐려지는 등 응급이면 바로 119에 연락하세요.</p>
</main>

<script>
const WORKER_URL = "https://orange-thunder-500d.qax888833.workers.dev";

const sym = document.getElementById("sym");
const onset = document.getElementById("onset");
const go = document.getElementById("go");
const out = document.getElementById("out");
const statusEl = document.getElementById("status");

function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
onset.max = ymd(new Date());

document.getElementById("chips").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") { sym.value = e.target.textContent; sym.focus(); }
});
document.getElementById("days").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") {
    const d = new Date(); d.setDate(d.getDate() - Number(e.target.dataset.d));
    onset.value = ymd(d);
  }
});

function onsetText(){
  if (!onset.value) return "증상 시작일: 모름";
  const p = onset.value.split("-").map(Number);
  const start = new Date(p[0], p[1] - 1, p[2]);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const n = Math.max(0, Math.round((now - start) / 86400000));
  return "증상 시작일: " + onset.value + " (" + (n === 0 ? "오늘 시작" : n + "일째") + ")";
}

const CHECK = ["tell", "ask", "costQuestions"];
const SECTIONS = [
  ["conditions", "🔎 가능성 있는 질환 (참고용)"],
  ["tell", "🗣️ 의사에게 꼭 말할 것"],
  ["ask", "❓ 의사에게 물어볼 질문"],
  ["tests", "🧪 받을 수 있는 검사와 이유"],
  ["prep", "📋 검사 전 준비사항"],
  ["costQuestions", "💬 비용이 걱정될 때 병원에 문의할 질문"]
];

function esc(s){ const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }

function render(d){
  let html = "";
  if (d.department || d.costRange) {
    html += '<div class="sum">';
    if (d.department) html += '<p class="k">방문하면 좋은 진료과</p><p class="v">' + esc(d.department) + '</p>';
    if (d.costRange) html += '<p class="k">예상 진료·검사비</p><p class="v">' + esc(d.costRange) + '</p><p class="n">' + esc(d.costNote || "병원마다 다르니 접수할 때 꼭 확인하세요.") + '</p>';
    html += '</div>';
  }
  for (const [key, title] of SECTIONS) {
    const arr = Array.isArray(d[key]) ? d[key] : [];
    if (!arr.length) continue;
    html += '<section class="r"><h2>' + title + '</h2>';
    if (CHECK.includes(key)) {
      html += arr.map(x => '<label class="chk"><input type="checkbox"><span>' + esc(x) + '</span></label>').join("");
    } else {
      html += '<ul>' + arr.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>';
    }
    html += '</section>';
  }
  out.innerHTML = html;
}

go.addEventListener("click", async () => {
  const text = sym.value.trim();
  if (text.length < 4) { statusEl.innerHTML = '<span class="err">증상을 조금 더 자세히 적어주세요.</span>'; return; }
  go.disabled = true; out.innerHTML = ""; statusEl.textContent = "정리하는 중이에요… (최대 30초)";
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symptom: text + "\n" + onsetText() })
    });
    if (!res.ok) throw new Error("서버 응답 오류 " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    statusEl.textContent = "";
    out.scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    statusEl.innerHTML = '<span class="err">연결에 실패했어요: ' + esc(e.message) + '<br>잠시 뒤 다시 눌러보세요.</span>';
  } finally { go.disabled = false; }
});
</script>
</body>
  </html>
